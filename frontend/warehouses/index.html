<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warehouses - Apex Inventory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/custom.css" />
</head>
<body class="bg-slate-50">
  <div id="app-layout">
    
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6 gap-4">
      <div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight">Warehouse Facilities</h1>
        <p class="text-xs text-slate-500 mt-1">Multi-location storage management within this single business</p>
      </div>
      <button id="add-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl shadow-sm transition flex items-center self-start sm:self-auto">
        <i class="fa-solid fa-plus mr-2"></i> Add Warehouse
      </button>
    </div>

    <!-- WAREHOUSES CARDS GRID -->
    <div id="warehouses-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
      <div class="p-8 text-center text-slate-400 text-xs">Loading facilities...</div>
    </div>

  </div>

  <!-- ADD / EDIT MODAL -->
  <div id="wh-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm hidden">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 id="modal-title" class="text-base font-bold text-slate-900">Add Warehouse</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <form id="wh-form" class="mt-4 space-y-4">
        <input type="hidden" id="wh-id" />
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Warehouse Name <span class="text-rose-500">*</span></label>
          <input type="text" id="wh-name" required placeholder="Central Logistics Hub" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Physical Location Address <span class="text-rose-500">*</span></label>
          <input type="text" id="wh-location" required placeholder="123 Enterprise Blvd, Chicago, IL" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Facility Manager</label>
            <input type="text" id="wh-manager" placeholder="Elena Rostova" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Phone Number</label>
            <input type="text" id="wh-phone" placeholder="+1 (555) 019-2834" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Description / Notes</label>
          <textarea id="wh-desc" rows="2" placeholder="Facility notes, loading dock instructions..." class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
        </div>
        <div class="flex items-center space-x-2 pt-1">
          <input type="checkbox" id="wh-is-default" class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 border-slate-300" />
          <label for="wh-is-default" class="text-xs font-semibold text-slate-700 cursor-pointer">Set as Primary Default Warehouse for incoming purchases & sales</label>
        </div>
        <div class="flex justify-end space-x-2 pt-3 border-t border-slate-100">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl">Cancel</button>
          <button type="submit" class="px-5 py-2 text-xs font-bold bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-sm">Save Warehouse</button>
        </div>
      </form>
    </div>
  </div>

  <!-- VIEW WAREHOUSE STOCK MODAL -->
  <div id="stock-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm hidden overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl border border-slate-100 my-8">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div>
          <h3 id="stock-modal-title" class="text-base font-bold text-slate-900">Warehouse Inventory</h3>
          <p id="stock-modal-subtitle" class="text-xs text-slate-500"></p>
        </div>
        <button onclick="closeStockModal()" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="mt-4 max-h-96 overflow-y-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-50 text-slate-500 uppercase font-bold border-b border-slate-100 sticky top-0">
            <tr>
              <th class="px-4 py-2.5">Product & SKU</th>
              <th class="px-4 py-2.5">Category</th>
              <th class="px-4 py-2.5 text-right">In-Stock Quantity</th>
            </tr>
          </thead>
          <tbody id="wh-stock-tbody" class="divide-y divide-slate-100">
          </tbody>
        </table>
      </div>
      <div class="mt-4 pt-3 border-t border-slate-100 flex justify-end">
        <button onclick="closeStockModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl">Close</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    Layout.init('warehouses');

    async function loadWarehouses() {
      try {
        const res = await API.get('/warehouses');
        const list = res.data;
        const container = document.getElementById('warehouses-grid');

        if (list.length === 0) {
          container.innerHTML = '<div class="col-span-3 text-center py-12 text-slate-400 text-xs">No warehouses configured yet.</div>';
          return;
        }

        container.innerHTML = list.map(w => `
          <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 flex flex-col justify-between relative overflow-hidden">
            ${w.is_default ? '<div class="absolute top-0 right-0 bg-blue-600 text-white text-[10px] font-bold px-3 py-1 rounded-bl-xl uppercase tracking-wider">Default</div>' : ''}
            <div>
              <div class="flex items-center space-x-3 mb-3">
                <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg">
                  <i class="fa-solid fa-warehouse"></i>
                </div>
                <div class="truncate">
                  <h3 class="text-sm font-bold text-slate-900 truncate">${w.name}</h3>
                  <div class="text-[11px] text-slate-500 truncate"><i class="fa-solid fa-location-dot mr-1 text-slate-400"></i>${w.location}</div>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-3 my-4 p-3 bg-slate-50/80 rounded-xl border border-slate-100 text-xs">
                <div>
                  <span class="text-slate-400 block text-[10px] uppercase font-semibold">Stocked SKUs</span>
                  <span class="font-black text-slate-900 text-sm">${w.total_products} items</span>
                </div>
                <div>
                  <span class="text-slate-400 block text-[10px] uppercase font-semibold">Total In-Hand Units</span>
                  <span class="font-black text-blue-600 text-sm">${w.total_units} units</span>
                </div>
              </div>

              <div class="text-xs text-slate-600 space-y-1 mb-4">
                <div><span class="text-slate-400 font-medium">Manager:</span> ${w.manager || 'Unassigned'}</div>
                <div><span class="text-slate-400 font-medium">Phone:</span> ${w.phone || 'N/A'}</div>
              </div>
            </div>

            <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
              <button onclick="viewWarehouseStock(${w.id})" class="text-xs font-bold text-blue-600 hover:text-blue-700 flex items-center">
                <i class="fa-solid fa-boxes-stacked mr-1.5"></i> View Stock
              </button>
              <div class="space-x-1">
                <button onclick="editWarehouse(${w.id})" class="p-1.5 text-slate-400 hover:text-indigo-600 rounded-lg hover:bg-slate-100">
                  <i class="fa-solid fa-pen-to-square"></i>
                </button>
                <button onclick="deleteWarehouse(${w.id}, '${w.name.replace(/'/g, "\\'")}')" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-slate-100">
                  <i class="fa-solid fa-trash-can"></i>
                </button>
              </div>
            </div>
          </div>
        `).join('');

      } catch (err) {
        Toast.error(err.message);
      }
    }

    const modal = document.getElementById('wh-modal');
    const form = document.getElementById('wh-form');

    document.getElementById('add-btn').addEventListener('click', () => {
      form.reset();
      document.getElementById('wh-id').value = '';
      document.getElementById('modal-title').innerText = 'Add Warehouse';
      modal.classList.remove('hidden');
    });

    function closeModal() {
      modal.classList.add('hidden');
    }

    async function editWarehouse(id) {
      try {
        const res = await API.get(`/warehouses/${id}`);
        const w = res.data;
        document.getElementById('wh-id').value = w.id;
        document.getElementById('modal-title').innerText = 'Edit Warehouse';
        document.getElementById('wh-name').value = w.name;
        document.getElementById('wh-location').value = w.location;
        document.getElementById('wh-manager').value = w.manager || '';
        document.getElementById('wh-phone').value = w.phone || '';
        document.getElementById('wh-desc').value = w.description || '';
        document.getElementById('wh-is-default').checked = !!w.is_default;
        modal.classList.remove('hidden');
      } catch (err) {
        Toast.error(err.message);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('wh-id').value;
      const payload = {
        name: document.getElementById('wh-name').value.trim(),
        location: document.getElementById('wh-location').value.trim(),
        manager: document.getElementById('wh-manager').value.trim(),
        phone: document.getElementById('wh-phone').value.trim(),
        description: document.getElementById('wh-desc').value.trim(),
        is_default: document.getElementById('wh-is-default').checked ? 1 : 0
      };

      try {
        if (id) {
          await API.put(`/warehouses/${id}`, payload);
          Toast.success('Warehouse updated');
        } else {
          await API.post('/warehouses', payload);
          Toast.success('Warehouse created');
        }
        closeModal();
        loadWarehouses();
      } catch (err) {
        Toast.error(err.message);
      }
    });

    async function deleteWarehouse(id, name) {
      if (!confirm(`Delete or deactivate warehouse "${name}"?`)) return;
      try {
        await API.delete(`/warehouses/${id}`);
        Toast.success('Warehouse removed');
        loadWarehouses();
      } catch (err) {
        Toast.error(err.message);
      }
    }

    // View Warehouse Stock Modal
    const stockModal = document.getElementById('stock-modal');
    function closeStockModal() {
      stockModal.classList.add('hidden');
    }

    async function viewWarehouseStock(id) {
      try {
        const res = await API.get(`/warehouses/${id}`);
        const w = res.data;
        document.getElementById('stock-modal-title').innerText = w.name;
        document.getElementById('stock-modal-subtitle').innerText = `${w.location} - ${w.stock ? w.stock.length : 0} stocked items`;

        const tbody = document.getElementById('wh-stock-tbody');
        if (!w.stock || w.stock.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3" class="px-4 py-6 text-center text-slate-400">No stock in this warehouse.</td></tr>';
        } else {
          tbody.innerHTML = w.stock.map(s => `
            <tr class="hover:bg-slate-50">
              <td class="px-4 py-2.5 font-bold text-slate-900">${s.product_name} <span class="block text-[10px] text-slate-400 font-mono font-normal">SKU: ${s.sku}</span></td>
              <td class="px-4 py-2.5 text-slate-600">${s.category_name || '-'}</td>
              <td class="px-4 py-2.5 text-right font-black text-slate-900">${s.quantity} ${s.unit}</td>
            </tr>
          `).join('');
        }
        stockModal.classList.remove('hidden');
      } catch (err) {
        Toast.error(err.message);
      }
    }

    document.addEventListener('DOMContentLoaded', loadWarehouses);
  </script>
</body>
</html>

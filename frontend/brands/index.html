<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brands - Apex Inventory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/custom.css" />
</head>
<body class="bg-slate-50">
  <div id="app-layout">
    
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6 gap-4">
      <div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight">Product Brands</h1>
        <p class="text-xs text-slate-500 mt-1">Manage hardware manufacturers and brand labels</p>
      </div>
      <button id="add-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl shadow-sm transition flex items-center self-start sm:self-auto">
        <i class="fa-solid fa-plus mr-2"></i> Add Brand
      </button>
    </div>

    <!-- SEARCH & FILTER -->
    <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm mb-6">
      <div class="flex flex-col sm:flex-row gap-3">
        <div class="flex-1 relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
            <i class="fa-solid fa-magnifying-glass text-xs"></i>
          </span>
          <input type="text" id="search-input" placeholder="Search brands..." class="w-full pl-9 pr-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <select id="status-filter" class="px-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
          <option value="">All Statuses</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
    </div>

    <!-- TABLE -->
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
      <table class="w-full text-left text-xs">
        <thead class="bg-slate-50 text-slate-500 uppercase font-bold border-b border-slate-100">
          <tr>
            <th class="px-5 py-3.5">Brand Name</th>
            <th class="px-4 py-3.5">Description</th>
            <th class="px-4 py-3.5">Assigned Products</th>
            <th class="px-4 py-3.5">Status</th>
            <th class="px-5 py-3.5 text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="brands-tbody" class="divide-y divide-slate-100">
          <tr><td colspan="5" class="px-5 py-8 text-center text-slate-400">Loading brands...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- MODAL -->
  <div id="brand-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 id="modal-title" class="text-base font-bold text-slate-900">Add Brand</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <form id="brand-form" class="mt-4 space-y-4">
        <input type="hidden" id="brand-id" />
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Brand Name <span class="text-rose-500">*</span></label>
          <input type="text" id="brand-name" required placeholder="e.g. Dell Technologies" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Description</label>
          <textarea id="brand-desc" rows="3" placeholder="Brand overview or warranty terms..." class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Status</label>
          <select id="brand-status" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 bg-white">
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
        <div class="flex justify-end space-x-2 pt-3 border-t border-slate-100">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl">Cancel</button>
          <button type="submit" class="px-5 py-2 text-xs font-bold bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-sm">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    Layout.init('brands');

    async function loadBrands() {
      const search = document.getElementById('search-input').value.trim();
      const status = document.getElementById('status-filter').value;
      try {
        const res = await API.get('/brands', { search, status });
        const brands = res.data;
        const tbody = document.getElementById('brands-tbody');

        if (brands.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="px-5 py-8 text-center text-slate-400">No brands found.</td></tr>';
          return;
        }

        tbody.innerHTML = brands.map(b => `
          <tr class="hover:bg-slate-50/80 transition">
            <td class="px-5 py-3.5 font-bold text-slate-900">${b.name}</td>
            <td class="px-4 py-3.5 text-slate-500 max-w-xs truncate">${b.description || '-'}</td>
            <td class="px-4 py-3.5"><span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-blue-50 text-blue-700 border border-blue-200">${b.product_count} products</span></td>
            <td class="px-4 py-3.5"><span class="px-2 py-0.5 rounded-full text-[10px] font-bold border ${b.status === 'active' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-slate-100 text-slate-600 border-slate-200'}">${b.status}</span></td>
            <td class="px-5 py-3.5 text-right space-x-2">
              <button onclick="editBrand(${b.id}, '${b.name.replace(/'/g, "\\'")}', '${(b.description || '').replace(/'/g, "\\'")}', '${b.status}')" class="p-1.5 text-slate-500 hover:text-indigo-600 rounded-lg hover:bg-slate-100">
                <i class="fa-solid fa-pen-to-square"></i>
              </button>
              <button onclick="deleteBrand(${b.id}, '${b.name.replace(/'/g, "\\'")}')" class="p-1.5 text-slate-500 hover:text-rose-600 rounded-lg hover:bg-slate-100">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        Toast.error(err.message);
      }
    }

    const modal = document.getElementById('brand-modal');
    const form = document.getElementById('brand-form');

    document.getElementById('add-btn').addEventListener('click', () => {
      form.reset();
      document.getElementById('brand-id').value = '';
      document.getElementById('modal-title').innerText = 'Add Brand';
      modal.classList.remove('hidden');
    });

    function closeModal() {
      modal.classList.add('hidden');
    }

    function editBrand(id, name, desc, status) {
      document.getElementById('brand-id').value = id;
      document.getElementById('brand-name').value = name;
      document.getElementById('brand-desc').value = desc;
      document.getElementById('brand-status').value = status;
      document.getElementById('modal-title').innerText = 'Edit Brand';
      modal.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('brand-id').value;
      const payload = {
        name: document.getElementById('brand-name').value.trim(),
        description: document.getElementById('brand-desc').value.trim(),
        status: document.getElementById('brand-status').value
      };

      try {
        if (id) {
          await API.put(`/brands/${id}`, payload);
          Toast.success('Brand updated');
        } else {
          await API.post('/brands', payload);
          Toast.success('Brand created');
        }
        closeModal();
        loadBrands();
      } catch (err) {
        Toast.error(err.message);
      }
    });

    async function deleteBrand(id, name) {
      if (!confirm(`Delete brand "${name}"?`)) return;
      try {
        await API.delete(`/brands/${id}`);
        Toast.success('Brand deleted');
        loadBrands();
      } catch (err) {
        Toast.error(err.message);
      }
    }

    document.getElementById('search-input').addEventListener('input', () => loadBrands());
    document.getElementById('status-filter').addEventListener('change', () => loadBrands());

    document.addEventListener('DOMContentLoaded', loadBrands);
  </script>
</body>
</html>
